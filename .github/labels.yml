# Declarative GitHub labels for folio-vitae.
# Synced by .github/workflows/labels.yml (EndBug/label-sync).

# --- Type ---
- name: bug
  color: "d73a4a"
  description: Something isn't working
- name: enhancement
  color: "a2eeef"
  description: New feature or request
- name: refactor
  color: "fbca04"
  description: Code cleanup with no intended behavior change
- name: docs
  color: "0075ca"
  description: Documentation only
  aliases:
    - documentation
- name: chore
  color: "fef2c0"
  description: Maintenance, tooling, dependencies, or release plumbing
- name: security
  color: "ee0701"
  description: Vulnerability, hardening, or security-related change

# --- Area ---
- name: cli
  color: "0e8a16"
  description: CLI commands, config, and .env handling
- name: templates
  color: "1d76db"
  description: HTML templates under templates/
- name: assets
  color: "5319e7"
  description: Styles, scripts, fonts, and icons
- name: i18n
  color: "bfd4f2"
  description: Translations, languages, and locale formats
- name: "site:main"
  color: "c2e0c6"
  description: Main personal website surface
- name: "site:cv"
  color: "bfdadc"
  description: CV website surface
- name: docker
  color: "0052cc"
  description: Docker image, compose, or GHCR packaging
- name: ci
  color: "e4e669"
  description: GitHub Actions and CI/CD workflows

# --- Priority / status ---
- name: "priority: high"
  color: "b60205"
  description: Blocks release or everyday use
- name: good first issue
  color: "7057ff"
  description: Good for newcomers
- name: help wanted
  color: "008672"
  description: Extra attention is needed
- name: needs triage
  color: "d4c5f9"
  description: Needs classification before work starts
- name: duplicate
  color: "cfd3d7"
  description: This issue or pull request already exists
- name: invalid
  color: "e4e669"
  description: This doesn't seem right
- name: wontfix
  color: "ffffff"
  description: This will not be worked on

# --- Automation ---
- name: dependencies
  color: "0366d6"
  description: Dependency updates (Dependabot and similar)
