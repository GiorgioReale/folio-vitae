name: Rust CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Format
            command: cargo fmt --all -- --check
          - name: Clippy
            command: cargo clippy --all-targets --all-features -- -D warnings
          - name: Test
            command: cargo test --all-targets --all-features --locked
          - name: Build
            command: cargo build --release --all-features --locked
          - name: Check
            command: cargo check --all-targets --all-features --locked
          - name: Verify project metadata
            command: cargo verify-project --locked
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}

  security:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Cargo Audit
            installer: cargo-audit
            command: cargo audit
          - name: Cargo Deny
            installer: cargo-deny
            command: cargo deny check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install ${{ matrix.installer }}
        uses: taiki-e/install-action@v2
        with:
          tool: ${{ matrix.installer }}

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-msrv
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-msrv

      - name: Verify MSRV
        run: cargo msrv verify -- cargo check --all-targets --all-features --locked
