name: Rust CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.flags.outputs.rust }}
    steps:
      - name: Checkout repository
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v7

      - name: Detect path filters
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - 'src/**'
              - 'tests/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'rustfmt.toml'
              - 'clippy.toml'
              - 'assets/**'
              - 'templates/**'
              - 'static/**'
              - 'i18n/**'
              - 'data_example/**'
              - '.github/workflows/rust-ci.yml'

      - name: Set job flags
        id: flags
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=${{ steps.filter.outputs.rust }}" >> "$GITHUB_OUTPUT"
          fi

  checks:
    name: ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Format
            command: cargo fmt --all -- --check
          - name: Clippy
            command: cargo clippy --all-targets --all-features -- -D warnings
          - name: Test
            command: cargo test --all-targets --all-features --locked
          - name: Build
            command: cargo build --release --all-features --locked
          - name: Check
            command: cargo check --all-targets --all-features --locked
          - name: Verify project metadata
            command: cargo verify-project --locked
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}

  msrv:
    name: MSRV
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-msrv
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-msrv

      - name: Verify MSRV
        run: cargo msrv verify -- cargo check --all-targets --all-features --locked

  # Always reports a conclusion so required status checks are never left "missing"
  # when Rust paths did not change (matrix jobs skipped).
  merge-gate:
    name: Merge gate
    needs: [changes, checks, msrv]
    if: always() && needs.changes.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate required Rust CI jobs
        run: |
          set -euo pipefail
          rust="${{ needs.changes.outputs.rust }}"

          if [ "${rust}" = "true" ]; then
            echo "Rust checks result: ${{ needs.checks.result }}"
            [ "${{ needs.checks.result }}" = "success" ]
            echo "MSRV result: ${{ needs.msrv.result }}"
            [ "${{ needs.msrv.result }}" = "success" ]
          else
            echo "Rust path checks not required for this change set"
          fi
