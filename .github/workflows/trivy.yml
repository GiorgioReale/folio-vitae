name: Trivy

on:
  schedule:
    # Weekly re-scan of the published image for newly disclosed CVEs.
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      image_tag:
        description: Tag of ghcr.io/<repo> to scan (default latest)
        required: false
        type: string
        default: latest
  workflow_call:
    inputs:
      image_ref:
        description: Full image reference to scan (name:tag or name@digest)
        required: true
        type: string
      sarif_category:
        description: Category for the uploaded SARIF results
        required: false
        type: string
        default: trivy

permissions:
  contents: read
  packages: read
  security-events: write
  actions: read

concurrency:
  group: trivy-${{ inputs.image_ref || inputs.image_tag || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  TRIVY_SEVERITY: CRITICAL,HIGH

jobs:
  scan:
    name: Scan image
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve image reference
        id: image
        env:
          CALL_REF: ${{ inputs.image_ref }}
          INPUT_TAG: ${{ inputs.image_tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          repo="$(printf '%s' "${REPOSITORY}" | tr '[:upper:]' '[:lower:]')"

          if [ -n "${CALL_REF}" ]; then
            ref="${CALL_REF}"
          else
            tag="${INPUT_TAG:-latest}"
            if ! printf '%s' "${tag}" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._/-]*$'; then
              echo "Invalid image_tag: only letters, digits, . _ / - are allowed"
              exit 1
            fi
            ref="${REGISTRY}/${repo}:${tag}"
          fi

          if ! printf '%s' "${ref}" | grep -Eq '^[A-Za-z0-9._/:@-]+$'; then
            echo "Invalid image reference: ${ref}"
            exit 1
          fi

          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "Scanning ${ref}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner
        id: trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: sarif
          output: trivy-results.sarif
          exit-code: "1"
          ignore-unfixed: true
          severity: ${{ env.TRIVY_SEVERITY }}
          vuln-type: os,library
          trivyignores: .trivyignore


      - name: Upload Trivy SARIF
        if: always() && steps.trivy.outcome != 'skipped'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: ${{ inputs.sarif_category || 'trivy-latest' }}
