name: Docker

on:
  # Always run on PRs to main so the "Docker gate" check is reported for branch
  # protection. Expensive builds stay behind the path filter in the changes job.
  pull_request:
    branches:
      - main
  workflow_call:
    inputs:
      git_ref:
        description: Git ref to build (branch, tag, or SHA). Empty uses the caller SHA.
        required: false
        type: string
        default: ""
      update_latest:
        description: Tag the image as latest
        required: false
        type: boolean
        default: true
      update_version_tags:
        description: Also tag with the Cargo.toml app version (e.g. 0.1.9 and 0.1)
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      git_ref:
        description: Git ref to build (branch, tag, or SHA). Empty uses the default branch.
        required: false
        type: string
        default: ""
      update_latest:
        description: Tag the image as latest
        required: false
        type: boolean
        default: true
      update_version_tags:
        description: Also tag with the Cargo.toml app version (e.g. 0.1.9 and 0.1), without a new GitHub Release
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: write
  pull-requests: read
  security-events: write
  actions: read

concurrency:
  group: docker-${{ inputs.git_ref || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  TRIVY_SEVERITY: CRITICAL,HIGH

jobs:
  changes:
    name: Detect Docker changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docker: ${{ steps.flags.outputs.docker }}
    steps:
      - name: Checkout repository
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7

      - name: Detect path filters
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            docker:
              - 'Dockerfile'
              - '.dockerignore'
              - '.github/workflows/docker.yml'
              - '.github/workflows/trivy.yml'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'src/**'
              - 'assets/**'
              - 'templates/**'
              - 'static/**'
              - 'i18n/**'
              - 'data_example/**'

      - name: Set job flags
        id: flags
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "docker=${{ steps.filter.outputs.docker }}" >> "$GITHUB_OUTPUT"
          else
            # workflow_call / workflow_dispatch / schedule callers always build.
            echo "docker=true" >> "$GITHUB_OUTPUT"
          fi

  # Native runners per arch (no QEMU). Digests are merged into a multi-arch
  # manifest on non-PR events; PRs only verify that each platform builds.
  # Build-time Trivy stays here (same runner as the loaded/pushed image).
  # Scheduled and post-publish scans live in trivy.yml.
  build:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-26.04
          - platform: linux/arm64
            runner: ubuntu-26.04-arm
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Resolve checkout ref
        id: checkout_ref
        env:
          INPUT_GIT_REF: ${{ inputs.git_ref }}
          FALLBACK_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_GIT_REF}" ]; then
            # Reject shell metacharacters; allow commit SHAs, tags, and branch names.
            if ! printf '%s' "${INPUT_GIT_REF}" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._/-]*$'; then
              echo "Invalid git_ref: only letters, digits, . _ / - are allowed"
              exit 1
            fi
            echo "ref=${INPUT_GIT_REF}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${FALLBACK_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ steps.checkout_ref.outputs.ref }}

      - name: Set image name
        run: echo "IMAGE_NAME=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}

      - name: Build (PR verify only)
        id: build_pr
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: folio-vitae:pr-${{ env.PLATFORM_PAIR }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=build-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=build-${{ env.PLATFORM_PAIR }}

      - name: Trivy scan (PR image)
        id: trivy_pr
        if: github.event_name == 'pull_request' && steps.build_pr.outcome == 'success'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: folio-vitae:pr-${{ env.PLATFORM_PAIR }}
          format: sarif
          output: trivy-results.sarif
          exit-code: "1"
          ignore-unfixed: true
          severity: ${{ env.TRIVY_SEVERITY }}
          vuln-type: os,library

      - name: Upload Trivy SARIF (PR)
        if: >-
          always()
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && steps.trivy_pr.outcome != 'skipped'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-pr-${{ env.PLATFORM_PAIR }}

      - name: Build and push by digest
        id: build
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=build-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=build-${{ env.PLATFORM_PAIR }}

      - name: Trivy scan (pushed digest)
        id: trivy_digest
        if: github.event_name != 'pull_request' && steps.build.outcome == 'success'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          exit-code: "1"
          ignore-unfixed: true
          severity: ${{ env.TRIVY_SEVERITY }}
          vuln-type: os,library

      - name: Upload Trivy SARIF (digest)
        if: always() && github.event_name != 'pull_request' && steps.trivy_digest.outcome != 'skipped'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-digest-${{ env.PLATFORM_PAIR }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: github.event_name != 'pull_request' && needs.changes.outputs.docker == 'true'
    needs: [changes, build]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    outputs:
      image_ref: ${{ steps.image_ref.outputs.ref }}
    steps:
      - name: Resolve checkout ref
        id: checkout_ref
        env:
          INPUT_GIT_REF: ${{ inputs.git_ref }}
          FALLBACK_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_GIT_REF}" ]; then
            if ! printf '%s' "${INPUT_GIT_REF}" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._/-]*$'; then
              echo "Invalid git_ref: only letters, digits, . _ / - are allowed"
              exit 1
            fi
            echo "ref=${INPUT_GIT_REF}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${FALLBACK_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ steps.checkout_ref.outputs.ref }}

      - name: Set image name
        run: echo "IMAGE_NAME=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Read Cargo.toml version
        id: cargo_version
        run: |
          CARGO_VERSION="$(awk '
            /^\[package\]$/ { in_package=1; next }
            /^\[/ && $0 != "[package]" { in_package=0 }
            in_package && /^version = / {
              gsub(/"/, "", $3)
              print $3
              exit
            }
          ' Cargo.toml)"

          if [ -z "$CARGO_VERSION" ]; then
            echo "Unable to determine package version from Cargo.toml"
            exit 1
          fi

          echo "version=$CARGO_VERSION" >> "$GITHUB_OUTPUT"
          echo "major_minor=$(echo "$CARGO_VERSION" | cut -d. -f1-2)" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            # Reusable workflows keep the caller's event name (e.g. `release`), never `workflow_call`.
            type=raw,value=latest,enable=${{ inputs.update_latest }}
            type=raw,value=${{ steps.cargo_version.outputs.version }},enable=${{ inputs.update_version_tags }}
            type=raw,value=${{ steps.cargo_version.outputs.major_minor }},enable=${{ inputs.update_version_tags }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect "${IMAGE_NAME}:${{ steps.meta.outputs.version }}"

      - name: Export published image ref
        id: image_ref
        run: echo "ref=${IMAGE_NAME}:${{ steps.meta.outputs.version }}" >> "$GITHUB_OUTPUT"

  trivy:
    if: github.event_name != 'pull_request'
    needs: merge
    uses: ./.github/workflows/trivy.yml
    with:
      image_ref: ${{ needs.merge.outputs.image_ref }}
      sarif_category: trivy-published
    permissions:
      contents: read
      packages: read
      security-events: write
      actions: read

  # Always reports a conclusion so required status checks are never left "missing"
  # when Docker paths did not change (build skipped).
  docker-gate:
    name: Docker gate
    needs: [changes, build]
    if: always() && needs.changes.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate Docker build requirement
        run: |
          set -euo pipefail
          if [ "${{ needs.changes.outputs.docker }}" != "true" ]; then
            echo "Docker build not required for this change set"
            exit 0
          fi
          result="${{ needs.build.result }}"
          echo "Docker build result: ${result}"
          [ "${result}" = "success" ]
