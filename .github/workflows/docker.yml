name: Docker

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/docker.yml
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - src/**
      - assets/**
      - templates/**
      - static/**
      - i18n/**
      - data_example/**
  workflow_call:
    inputs:
      git_ref:
        description: Git ref to build (branch, tag, or SHA). Empty uses the caller SHA.
        required: false
        type: string
        default: ""
      update_latest:
        description: Tag the image as latest
        required: false
        type: boolean
        default: true
      update_version_tags:
        description: Also tag with the Cargo.toml app version (e.g. 0.1.7 and 0.1)
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      git_ref:
        description: Git ref to build (branch, tag, or SHA). Empty uses the default branch.
        required: false
        type: string
        default: ""
      update_latest:
        description: Tag the image as latest
        required: false
        type: boolean
        default: true
      update_version_tags:
        description: Also tag with the Cargo.toml app version (e.g. 0.1.7 and 0.1), without a new GitHub Release
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ inputs.git_ref || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Resolve checkout ref
        id: checkout_ref
        run: |
          if [ -n "${{ inputs.git_ref }}" ]; then
            echo "ref=${{ inputs.git_ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ steps.checkout_ref.outputs.ref }}

      - name: Set image name
        run: echo "IMAGE_NAME=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Read Cargo.toml version
        id: cargo_version
        run: |
          CARGO_VERSION="$(awk '
            /^\[package\]$/ { in_package=1; next }
            /^\[/ && $0 != "[package]" { in_package=0 }
            in_package && /^version = / {
              gsub(/"/, "", $3)
              print $3
              exit
            }
          ' Cargo.toml)"

          if [ -z "$CARGO_VERSION" ]; then
            echo "Unable to determine package version from Cargo.toml"
            exit 1
          fi

          echo "version=$CARGO_VERSION" >> "$GITHUB_OUTPUT"
          echo "major_minor=$(echo "$CARGO_VERSION" | cut -d. -f1-2)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            # Reusable workflows keep the caller's event name (e.g. `release`), never `workflow_call`.
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' && inputs.update_latest }}
            type=raw,value=${{ steps.cargo_version.outputs.version }},enable=${{ github.event_name != 'pull_request' && inputs.update_version_tags }}
            type=raw,value=${{ steps.cargo_version.outputs.major_minor }},enable=${{ github.event_name != 'pull_request' && inputs.update_version_tags }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
