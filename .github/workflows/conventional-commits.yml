name: Conventional Commits

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: conventional-commits-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
            security
          requireScope: false

  commit-messages:
    name: Commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate commit messages
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.mjs

  # Always reports a conclusion so it can be a required status check.
  conventional-commits-gate:
    name: Conventional Commits gate
    needs: [pr-title, commit-messages]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate conventional commits jobs
        run: |
          set -euo pipefail
          echo "PR title: ${{ needs.pr-title.result }}"
          [ "${{ needs.pr-title.result }}" = "success" ]
          echo "Commit messages: ${{ needs.commit-messages.result }}"
          [ "${{ needs.commit-messages.result }}" = "success" ]
