name: Release

on:
  release:
    types:
      - published
  # Explicit dispatch so release-plz (GITHUB_TOKEN) can start publish without a PAT.
  # workflow_dispatch is one of the events that still run when triggered with GITHUB_TOKEN.
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to publish (e.g. v0.1.10)
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  security-events: write
  actions: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  # Fast gate shared by publish + docker so they can run in parallel.
  validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate release tag, Cargo.toml version, and main ancestry
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail

          if ! printf '%s' "${RELEASE_TAG}" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9._-]+)?$'; then
            echo "Release tag '${RELEASE_TAG}' must look like a version (e.g. v0.1.10)"
            exit 1
          fi

          if ! git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            echo "Release tag '${RELEASE_TAG}' is not a git tag in this repository"
            exit 1
          fi

          TAG_VERSION="${RELEASE_TAG#v}"
          CARGO_VERSION="$(awk '
            /^\[package\]$/ { in_package=1; next }
            /^\[/ && $0 != "[package]" { in_package=0 }
            in_package && /^version = / {
              gsub(/"/, "", $3)
              print $3
              exit
            }
          ' Cargo.toml)"

          if [ -z "$CARGO_VERSION" ]; then
            echo "Unable to determine package version from Cargo.toml"
            exit 1
          fi

          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "Release tag '$RELEASE_TAG' does not match Cargo.toml version '$CARGO_VERSION'"
            exit 1
          fi

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Checked-out release commit is not reachable from origin/main"
            exit 1
          fi

  publish:
    needs: validate
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Skip cargo publish --dry-run: it recompiles the crate (~7–8 min) and
      # duplicates work already covered by Rust CI on the release tag.
      - name: Publish to crates.io
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  docker:
    needs: validate
    uses: ./.github/workflows/docker.yml
    with:
      git_ref: ${{ github.event.release.tag_name || inputs.tag }}
      update_latest: true
      update_version_tags: true
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
      actions: read
