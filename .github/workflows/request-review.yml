name: Request review

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: request-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  request:
    name: Request GiorgioReale
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Add reviewer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO: ${{ github.repository }}
          REVIEWER: GiorgioReale
        run: |
          set -euo pipefail

          # GitHub does not allow requesting a review from the PR author.
          if [ "$PR_AUTHOR" = "$REVIEWER" ]; then
            echo "Skipping: @$REVIEWER is the PR author (self-review is not allowed)."
            exit 0
          fi

          already="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/requested_reviewers" \
            --jq '.users[].login' || true)"
          if printf '%s\n' "$already" | grep -qxF "$REVIEWER"; then
            echo "@$REVIEWER is already a requested reviewer."
            exit 0
          fi

          gh pr edit "$PR_NUMBER" --repo "$REPO" --add-reviewer "$REVIEWER"
          echo "Requested review from @$REVIEWER."
