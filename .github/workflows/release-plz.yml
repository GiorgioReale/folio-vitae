name: Release-plz

on:
  push:
    branches:
      - main

jobs:
  # Create git tag + GitHub Release when a release-plz PR is merged.
  # crates.io + GHCR stay in release.yml (started via workflow_dispatch below).
  release-plz-release:
    name: Release-plz release
    if: ${{ github.repository_owner == 'GiorgioReale' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      # Needed for `gh workflow run` with GITHUB_TOKEN
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run release-plz
        id: release-plz
        # Pin to the commit currently resolved by release-plz/action@v0.5 (v0.5.146).
        uses: release-plz/action@b2baf303c463c223526d52a8a91b0777f052cf3f
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Releases created with GITHUB_TOKEN do not fire `release: published`.
      # workflow_dispatch does run when invoked with GITHUB_TOKEN.
      - name: Trigger Release workflow
        if: ${{ steps.release-plz.outputs.releases_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          echo "$RELEASES" | jq -r '.[].tag' | while read -r tag; do
            if [ -z "$tag" ] || [ "$tag" = "null" ]; then
              continue
            fi
            echo "Dispatching Release workflow for $tag"
            gh workflow run release.yml -f "tag=$tag"
          done

  # Open/update the release PR with version bump + CHANGELOG.
  release-plz-pr:
    name: Release-plz PR
    if: ${{ github.repository_owner == 'GiorgioReale' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run release-plz
        # Pin to the commit currently resolved by release-plz/action@v0.5 (v0.5.146).
        uses: release-plz/action@b2baf303c463c223526d52a8a91b0777f052cf3f
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
