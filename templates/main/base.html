<!DOCTYPE html>
<html dir="{{ language_direction }}" lang="{{ language_tag }}">

<head>
  {{ <chrome.site_head site="main" /> }}
  {% block head_preload %}{% endblock head_preload %}
  {{ <chrome.site_head_assets site="main" /> }}
  {% block page_scripts %}{% endblock page_scripts %}
</head>

<body id="{% block body_id %}{% endblock body_id %}">
  {{ <chrome.skip_link /> }}
  {% block aside %}{% endblock aside %}
  <div class="page-shell">
    {{ <chrome.site_header site="main" /> }}
    {% block content %}{% endblock content %}
    {{ <chrome.site_footer site="main" /> }}
  </div>
</body>

</html>
