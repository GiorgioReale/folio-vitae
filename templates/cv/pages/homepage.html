{% extends "cv/base.html" %}
{% block body_id %}homepage{% endblock body_id %}
{% block aside %}
<div class="hero-media" aria-hidden="true"></div>
{% endblock aside %}
{% block content %}
<main id="main-content" tabindex="-1">
  <h1>{{ first_name }} {{ last_name }}</h1>
  <h2>{{ role }}</h2>
  <a href="{{ language_prefix ~ '/curriculum' }}">
    <svg aria-hidden="true" focusable="false">
      <use href="/assets/icons/cv/website/sprites.svg#right-arrow" xlink:href="/assets/icons/cv/website/sprites.svg#right-arrow" />
    </svg>
    <span class="sr-only">{{ translations.cv_homepage.curriculum_action }}</span>
  </a>
</main>
{% endblock content %}
