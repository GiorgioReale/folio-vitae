[workspace]
publish_timeout = "10m"
# cargo publish + Docker remain in .github/workflows/release.yml
publish = false
# Only tag/publish when the release-plz PR is merged (branch prefix release-plz-)
release_always = false
# Conventional commits, or sentence-case titles (excludes chore/ci/deps noise)
release_commits = "^(feat|fix|perf|docs|refactor)(\\(.+\\))?!?:|^[A-Z].+"
pr_name = "chore: release v{{ version }}"
pr_labels = ["release"]
git_release_body = """
{{ changelog }}

**Full changelog:** https://github.com/GiorgioReale/folio-vitae/blob/main/CHANGELOG.md
"""

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.
This project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

## [Unreleased]
"""
# Flat list: full PR/commit title + PR link (no Fixed/Added/Other sections).
body = """
## [{{ version }}]{%- if release_link -%}({{ release_link }}){% endif %} - {{ timestamp | date(format="%Y-%m-%d") }}

{% for commit in commits -%}
- {% if commit.remote.pr_title -%}
{{ commit.remote.pr_title }} ([#{{ commit.remote.pr_number }}]({{ remote.link }}/pull/{{ commit.remote.pr_number }}))
{%- else -%}
{{ commit.raw_message | split(pat="\n") | first }}
{%- endif -%}
{% if commit.remote.username %} by @{{ commit.remote.username }}{% endif %}
{% endfor %}
"""
sort_commits = "newest"
# Single group so nothing is skipped; sections are omitted by the body template above.
commit_parsers = [
  { message = "^.*", group = "changes" },
]
