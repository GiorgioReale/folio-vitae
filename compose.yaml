services:
  folio-vitae:
    image: ghcr.io/giorgioreale/folio-vitae:latest
    # Or pin a version: ghcr.io/giorgioreale/folio-vitae:0.1.9
    # Or build from this repo instead of pulling:
    # build: .
    container_name: folio-vitae
    restart: unless-stopped
    ports:
      - "36546:36546" # main site
      - "36547:36547" # CV site
    volumes:
      # Your YAML content and images (read-only is fine)
      - ./data:/app/data:ro
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: production
      DATA_DIR: /app/data
    healthcheck:
      # Both listeners share one process; probe each HTTP stack via a cheap static route.
      # BusyBox wget ships with Alpine (no extra packages). Ports follow MAIN_PORT / CV_PORT.
      test:
        [
          "CMD-SHELL",
          "wget -q -T 3 -O /dev/null http://127.0.0.1:$${MAIN_PORT:-36546}/robots.txt && wget -q -T 3 -O /dev/null http://127.0.0.1:$${CV_PORT:-36547}/robots.txt",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
