[package]
name = "folio-vitae"
version = "0.1.1"
edition = "2024"
rust-version = "1.88.0"
publish = true
authors = ["Giorgio Reale <info@giorgioreale.xyz>"]
description = "A simple tool to generate a personal website and online CV."
license = "MIT"
readme = "README.md"
repository = "https://github.com/GiorgioReale/folio-vitae"
keywords = ["cv", "portfolio", "website", "generator", "static-site"]
categories = [
  "command-line-utilities",
  "template-engine",
  "web-programming",
]

include = [
  "Cargo.toml",
  "Cargo.lock",
  "README.md",
  "LICENSE",
  "SECURITY.md",
  "CODE_OF_CONDUCT.md",
  "CONTRIBUTING.md",
  "rust-toolchain.toml",
  "rustfmt.toml",
  "src/**",
  "assets/**",
  "templates/**",
  "static/**",
  "i18n/**",
  "data_example/**",
]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }
nursery = { level = "allow", priority = -1 }
expect_used = "deny"
unwrap_used = "deny"

[features]
default = ["serve"]
serve = [
  "dep:fast_image_resize",
  "dep:grass",
  "dep:ico",
  "dep:image",
  "dep:minifier",
  "dep:resvg",
  "dep:axum",
  "dep:hyper",
  "dep:tower",
  "dep:tower-http",
]
smtp = ["dep:lettre"]

[dependencies]
axum = { version = "0.8", optional = true }
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
grass = { version = "0.13", optional = true }
http = "1.4"
include_dir = "0.7"
minifier = { version = "0.3", default-features = false, features = ["html"], optional = true }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
serde_ignored = "0.1"
serde_path_to_error = "0.1"
strsim = "0.11"
webbrowser = "1.2"

simpleicons-rs = "16"
tera = { version = "1.20", features = ["chrono"] }

tokio = { version = "1.50", features = [
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }

tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", optional = true, features = [
  "compression-full",
  "fs",
  "limit",
  "set-header",
] }

walkdir = "2.5"
dotenvy = "0.15"
sha2 = "0.11"
flate2 = "1.1"

lettre = { version = "0.11.22", default-features = false, features = [
  "builder",
  "smtp-transport",
  "tokio1-rustls",
  "ring",
  "webpki-roots",
], optional = true }

image = { version = "0.25", features = ["ico"], optional = true }
fast_image_resize = { version = "6.0", optional = true }

resvg = { version = "0.47", optional = true }
ico = { version = "0.5", optional = true }

hyper = { version = "1.10", optional = true }
thiserror = "2.0"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
assert_cmd = "2"
assert_fs = "1"
predicates = "3"
insta = { version = "1.47", features = ["glob"] }
