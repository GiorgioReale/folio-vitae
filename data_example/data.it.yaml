# Italian content for folio-vitae. Comments stay in English; the values are Italian.
#
# Copy this file to data/data.it.yaml to enable the language.
# Add one file per language, named data/data.<code>.yaml (for example data/data.en.yaml).
#
# How to edit
# - Dates are calendar days, written YYYY-MM-DD and quoted.
# - Lists appear in the order written. Put the newest item first.
# - An end date of null, or a missing end date, means the item is still current.
#   The page prints the localized label ("Presente" in Italian). 9999-12-31 does the same.
# - A `>-` block folds wrapped lines into one paragraph. A blank line starts
#   a new paragraph in the PDF. The HTML page keeps the summary in a single paragraph.
# - Optional text can be left out or set to an empty string.
# - Unknown keys are rejected. Use only the fields shown here.
# - At least one of sites.main.domain and sites.cv.domain is required.
#   contact.emails.main is required too.

# Identity shared by every page: name, role, and place.
person:
  first_name: Alex
  last_name: Carter
  # Job title under the name on the CV, and in the PDF header.
  role: Sviluppatore full stack senior
  date_of_birth: '1992-04-18'

  # Place metadata. locality is the city printed on the CV.
  # The other fields become Open Graph tags when they are not empty.
  # locale uses the language_REGION form, such as it_IT, en_US, or es_ES.
  position:
    locale: it_IT
    locality: Austin
    region: Texas
    postal_code: '78701'
    country_name: Stati Uniti
    latitude: '30.2672'
    longitude: '-97.7431'

# The two generated sites, plus any other sites to link from the homepage.
sites:
  # Public homepage. domain is the hostname, without https:// or a trailing slash.
  main:
    domain: alexcarter.dev
    title: 'Alex Carter | Sviluppatore full stack senior'
    description: >-
      Sito personale di Alex Carter, sviluppatore full stack ad Austin.
      Note, talk e link al CV.
    # Stored with the site. The homepage keywords tag currently prints only the name.
    keywords:
      - Alex Carter
      - sviluppatore full stack
      - ingegnere del software
      - Austin

  # CV site. profile below is the resume itself.
  cv:
    domain: cv.alexcarter.dev
    title: 'Alex Carter | Curriculum Vitae'
    description: >-
      Esperienza, progetti selezionati, formazione e competenze di
      Alex Carter, sviluppatore full stack senior.
    # Appended after the full name in the CV keywords meta tag.
    keywords:
      - sviluppatore full stack senior
      - Rust
      - TypeScript
      - React
      - PostgreSQL
      - sistemi distribuiti
      - prestazioni web
      - Austin

    profile:
      # Opening section of the CV and the PDF. Two or three short paragraphs is enough.
      summary: >-
        Sviluppatore full stack senior, concentrato su prodotti che restano
        veloci e comprensibili man mano che crescono. Lavoro con frontend in
        TypeScript, servizi in Rust e Node, e PostgreSQL, e mi occupo tanto
        del percorso fino al rilascio quanto della funzionalità in sé.

        Il lavoro recente è stato su piattaforme interne e strumenti rivolti
        al cliente: sostituire un pannello di amministrazione legacy, ridurre
        la latenza p95 delle API e lasciare a un piccolo team una pipeline di
        deploy di cui si fida. Revisiono il design con prodotto e design, e
        lascio il codice più facile da modificare di come l'ho trovato.

      # One entry per company. Roles inside a company are newest first.
      # The printed CV adds a "more on the website" line after four companies.
      work_experiences:
        - company:
            name: BrightForge
            location: Da remoto
          roles:
            - title: Sviluppatore full stack senior
              start_date: '2023-03-01'
              # null: this role is current.
              end_date: null
              description: >-
                Guido lo sviluppo della piattaforma di amministrazione usata
                dai team di supporto e di customer success. Ho ricostruito i
                flussi più usati in React e TypeScript, spostato le scritture
                su un servizio in Rust con PostgreSQL e portato la latenza p95
                di quegli endpoint da circa 800 ms a meno di 200 ms.

                Definisco lo scope con prodotto, revisiono la maggior parte
                delle pull request del team e mantengo la pipeline di deploy
                (Docker, GitHub Actions) abbastanza snella da permettere a una
                nuova persona di pubblicare già nella prima settimana.

            - title: Sviluppatore full stack
              start_date: '2021-02-15'
              end_date: '2023-02-28'
              description: >-
                Ho rilasciato la prima versione degli strumenti di fatturazione
                e di account su TypeScript e PostgreSQL. Ho introdotto
                componenti UI condivisi, tracing a livello di richiesta e un
                percorso di migrazione fuori dall'applicazione di
                amministrazione precedente, scritta in PHP.

        - company:
            name: Northline Studio
            location: Austin, Texas
          roles:
            - title: Sviluppatore full stack
              start_date: '2018-06-01'
              end_date: '2021-01-29'
              description: >-
                Ho sviluppato applicazioni web per i clienti e una libreria di
                componenti condivisa, usata in circa una dozzina di progetti.
                Mi sono occupato dei budget di prestazioni del frontend, delle
                correzioni di accessibilità e delle API in Node dietro i siti
                di marketing.

                Ho accompagnato due sviluppatori junior e gestito il rilascio
                settimanale del cliente più grande dello studio.

        - company:
            name: Harbor & Co.
            location: Austin, Texas
          roles:
            - title: Sviluppatore web
              start_date: '2016-01-11'
              end_date: '2018-05-18'
              description: >-
                Ho consegnato siti vetrina e piccole funzionalità su misura
                per attività locali, con HTML, CSS, PHP e MySQL. Ho allestito
                il primo ambiente di staging dello studio e una routine di
                backup di base.

      # Side projects, open source, talks, or freelance work.
      # link is optional, but the CV prints an anchor for every project, so use a full URL.
      other_projects:
        - title: Starter Notes
          start_date: '2023-09-01'
          end_date: null
          description: >-
            Una piccola web app per prendere appunti, pensata per provare la
            sincronizzazione offline-first e un flusso di editing solo da
            tastiera. Il client è in React; l'API di sync è in Rust.
          link: https://github.com/alexcarter/starter-notes

        - title: Ledgerline
          start_date: '2022-04-01'
          end_date: '2022-11-30'
          description: >-
            Importatore open source che converte esportazioni CSV bancarie in
            file di contabilità a partita doppia. Progetto del weekend per
            imparare il parsing rigoroso e i property test.
          link: https://github.com/alexcarter/ledgerline

        - title: Civic Atlas
          start_date: '2019-01-07'
          end_date: '2019-06-14'
          description: >-
            Ricostruzione volontaria del sito di un'associazione di quartiere:
            pagine statiche, un calendario eventi e un modulo di contatto,
            senza script di tracciamento.
          link: https://github.com/alexcarter/civic-atlas

      # Newest program first. vote is optional; leave it out when there is no grade to show.
      # date_end null means the program is still in progress.
      educations:
        - institute: University of Texas at Austin
          educational_qualification: Master of Science
          course_of_study: Studi dell'informazione
          date_start: '2014-08-25'
          date_end: '2016-05-20'
          vote: '3.9 / 4.0'
          description: >-
            Corsi di gestione dei dati, interazione uomo-computer e
            architettura dell'informazione. Tesi su come rendere usabile la
            ricerca di archivi pubblici per chi non è specialista.

        - institute: University of Texas at Austin
          educational_qualification: Bachelor of Science
          course_of_study: Informatica
          date_start: '2010-08-23'
          date_end: '2014-05-17'
          description: >-
            Ingegneria del software, database e sistemi operativi. Assistente
            al corso introduttivo di programmazione nell'ultimo anno.

      # name is the accessible label. icon is a Simple Icons slug
      # (https://simpleicons.org) and must match exactly, for example nextdotjs.
      # The CV shows the icon; the name is read by screen readers. A short list
      # keeps the row from wrapping into a wall of logos.
      skills:
        - name: Rust
          icon: rust
        - name: TypeScript
          icon: typescript
        - name: React
          icon: react
        - name: Next.js
          icon: nextdotjs
        - name: Node.js
          icon: nodedotjs
        - name: PostgreSQL
          icon: postgresql
        - name: Docker
          icon: docker
        - name: Linux
          icon: linux

      # Courses and certificates, newest first.
      # The printed CV adds a "more on the website" line after four entries.
      # link is printed for every entry, so point it at the credential or the course page.
      courses_certifications:
        - title: Fondamenti di accessibilità web
          released_by: W3C
          released_on: '2024-02-12'
          link: https://www.w3.org/WAI/fundamentals/

        - title: Fondamenti di Rust
          released_by: partner di formazione della Rust Foundation
          released_on: '2023-06-03'
          link: https://www.rust-lang.org/learn

        - title: PostgreSQL per sviluppatori
          released_by: workshop della community PostgreSQL
          released_on: '2021-10-18'
          link: https://www.postgresql.org/docs/

  # Extra hostnames listed on the homepage, after the CV link.
  # Each entry needs a domain. title, description, and keywords are stored with it
  # and are not required for that homepage list.
  additional:
    - domain: notes.alexcarter.dev
      title: Note sul campo
      description: Articoli brevi su software web manutenibile e disciplina dei rilasci.
      keywords:
        - blog
        - software
        - note di engineering
    - domain: talks.alexcarter.dev
      title: Talk
      description: Slide e resoconti di meetup locali.
      keywords:
        - talk
        - slide
        - meetup

# Addresses and profiles. The homepage lists every email and every social.
# The CV uses contact.emails.cv, falling back to contact.emails.main when cv is empty.
contact:
  emails:
    main: hello@alexcarter.dev
    cv: work@alexcarter.dev
    other:
      - speaking@alexcarter.dev
      - press@alexcarter.dev

  # social_name selects the icon and must be a lowercase Simple Icons slug.
  # linkedin is the exception: it uses the icon shipped with the templates.
  # The CV sidebar shows only linkedin, github, gitlab, and stackoverflow.
  # The homepage shows the full list.
  # profile_nickname is the visible handle. link is the full profile URL.
  socials:
    - social_name: linkedin
      social_full_name: LinkedIn
      link: https://www.linkedin.com/in/alexcarter
      profile_nickname: alexcarter
    - social_name: github
      social_full_name: GitHub
      link: https://github.com/alexcarter
      profile_nickname: alexcarter
    - social_name: gitlab
      social_full_name: GitLab
      link: https://gitlab.com/alexcarter
      profile_nickname: alexcarter
    - social_name: stackoverflow
      social_full_name: Stack Overflow
      link: https://stackoverflow.com/users/0000000/alexcarter
      profile_nickname: alexcarter
    - social_name: mastodon
      social_full_name: Mastodon
      link: https://mastodon.social/@alexcarter
      profile_nickname: '@alexcarter@mastodon.social'
    - social_name: bluesky
      social_full_name: Bluesky
      link: https://bsky.app/profile/alexcarter.dev
      profile_nickname: '@alexcarter.dev'
