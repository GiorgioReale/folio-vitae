[advisories]
# Every ignored advisory must include:
# - reason: why the risk is accepted
# - what would replace / clear it
# - revisit-by date inside the reason (re-evaluate on or before that date)
# Do not leave permanent ignores without a revisit date.
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained (info advisory, no CVE). Direct dep for NaiveDate / Utc in models, render, state. Clear by migrating dates to jiff (or time). Revisit by 2027-03-01." },
]
unused-ignored-advisory = "deny"

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "NCSA",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
