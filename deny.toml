[advisories]
# Every ignored advisory must include:
# - reason: why the risk is accepted
# - what would replace / clear it
# - revisit-by date inside the reason (re-evaluate on or before that date)
# Do not leave permanent ignores without a revisit date.
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "Transitive paste 1.x via image→exr/ravif (pulp, rav1e). Unmaintained proc-macro only (no runtime CVE surface). Clear by migrating upstream to pastey (or dropping image/exr paths). Revisit by 2027-04-01." },
]
unused-ignored-advisory = "deny"
git-fetch-with-cli = true

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "NCSA",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
